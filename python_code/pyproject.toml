[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "two-strains-dengue-hms-model"
version = "0.1.0"
description = "Two-strain dengue HMS stochastic search utilities packaged for testing and CI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7.4",
]
docs = [
  "mkdocs>=1.6",
]

[project.scripts]
two-strains-dengue = "StochasticSearchPy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["StochasticSearchPy*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

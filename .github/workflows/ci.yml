name: CI

on:
  push:
    paths:
      - "python_code/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/pages.yml"
      - "README.md"
  pull_request:
    paths:
      - "python_code/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/pages.yml"
      - "README.md"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: python_code

    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and docs tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      - name: Run tests
        run: python -m pytest

      - name: Build docs
        run: mkdocs build --strict

      - name: Prepare reference data
        run: two-strains-dengue prepare-data --output-dir ./artifacts/ci-data

      - name: Smoke test CLI
        run: two-strains-dengue smoke --data-dir ./artifacts/ci-data --runtime-dir ./artifacts/ci-smoke

      - name: Build package
        run: python -m build
